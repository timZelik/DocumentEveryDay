[project]
name = "documenteveryday"
version = "0.1.0"
description = "A personal, agentic short-form clip pipeline: footage in, reviewed 9:16 clips out."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.13",
    "faster-whisper>=1.2",
    "fastapi>=0.140",
    "uvicorn[standard]>=0.50",
]

[project.optional-dependencies]
development = ["pytest>=9", "httpx>=0.28", "ruff>=0.14"]

[project.scripts]
documenteveryday = "documenteveryday.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["documenteveryday*"]

[tool.setuptools.package-data]
"documenteveryday.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ffmpeg: needs the ffmpeg binary on PATH"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"documenteveryday/captions/ass_subtitles.py" = ["E501"]
